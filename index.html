<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVI — metodika | SI Kurs dasturi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F5F6FA;
            --bg-card: #FFFFFF;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --primary-blue: #3B49DF;
            --primary-light: #EEF2FF;
            --border-color: #E5E7EB;
            --shadow-card: 0 4px 20px -2px rgba(17, 24, 39, 0.05), 0 2px 6px -1px rgba(17, 24, 39, 0.03);
            --shadow-hover: 0 12px 28px -4px rgba(59, 73, 223, 0.12), 0 4px 10px -2px rgba(17, 24, 39, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            line-height: 1.5;
            padding: 48px 24px 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Styles matching image */
        header {
            margin-bottom: 36px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #6B7280;
            font-weight: 400;
        }

        /* Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        @media (max-width: 992px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 32px 16px 60px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 26px;
            }
        }

        /* Card Styles */
        .card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 28px 26px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(229, 231, 235, 0.7);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            position: relative;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(59, 73, 223, 0.3);
        }

        .card:active {
            transform: translateY(-2px);
        }

        .card-stage {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 21px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.55;
            flex-grow: 1;
        }

        .card-points {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 22px;
            flex-grow: 1;
        }

        .card-points li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 15px;
            line-height: 1.45;
            color: #374151;
            font-weight: 500;
        }

        .card-points li::before {
            content: "✓";
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 1px;
            border-radius: 6px;
            background: var(--primary-light);
            color: var(--primary-blue);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-footer {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-footer .arrow-hint {
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.2s ease;
            font-size: 13px;
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 99px;
        }

        .card:hover .card-footer .arrow-hint {
            opacity: 1;
            transform: translateX(0);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, 0.55);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #FFFFFF;
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            border-radius: 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px 28px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            background: #FAFAFC;
        }

        .modal-stage {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary-blue);
            margin-bottom: 4px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .close-btn {
            background: #F3F4F6;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #4B5563;
            font-size: 20px;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
        }

        .close-btn:hover {
            background: #E5E7EB;
            color: #111827;
        }

        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #4B5563;
            background: #F3F4F6;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .topic-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .topic-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: #F9FAFB;
            border: 1px solid #F3F4F6;
            border-radius: 12px;
            transition: background 0.15s, border-color 0.15s;
        }

        .topic-item:hover {
            background: var(--primary-light);
            border-color: rgba(59, 73, 223, 0.2);
        }

        .topic-num {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #EEF2FF;
            color: var(--primary-blue);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .topic-item:hover .topic-num {
            background: var(--primary-blue);
            color: #FFFFFF;
        }

        .topic-text {
            font-size: 15px;
            font-weight: 500;
            color: #1F2937;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1 class="title">NAVI — metodika</h1>
            <p class="subtitle">6 oy · 50 ta mavzu va amaliy loyihalar · Oyni tanla &rarr; loyiha va darslarni ko'r.</p>
        </header>

        <div class="cards-grid" id="cardsGrid">
            <!-- JS orqali cardlar shu yerga chiqadi -->
        </div>
    </div>

    <!-- Modal oyna -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div>
                    <div class="modal-stage" id="modalStage">1-BOSQICH</div>
                    <h2 class="modal-title" id="modalTitle">1-oy</h2>
                </div>
                <button class="close-btn" id="closeModalBtn" aria-label="Yopish">&times;</button>
            </div>
            <div class="modal-body">
                <div class="section-badge" id="modalCountBadge">📌 Ushbu oydagi darslar va amaliy loyihalar:</div>
                <ul class="topic-list" id="modalTopicList"></ul>
            </div>
        </div>
    </div>

    <script>
        const courseData = [
            {
                id: 1,
                stage: "1-BOSQICH · FUNDAMENTAL VA DASTURLASH ASOSLARI",
                monthTitle: "1-oy · SI asoslari, amaliy va nazariy darslar",
                description: "SI turlari, Prompt yozish, Google AI Studio, Bolt, Antigravity hamda Web dasturlash (HTML, CSS, Tailwind, JS, TS, Git) asoslari.",
                points: [
                    "SI nima?",
                    "SI yo'nalishlari",
                    "Asosiy SI texnologiyalari",
                    "SI bilan sayt qurish",
                    "Loyihalarni boshqarish",
                    "Oylik imtihon"
                ],
                topics: [
                    "SI nima?",
                    "SI yo'nalishlari",
                    "SI evolutsiyasi",
                    "SI turlari",
                    "Tor doiradagi SI va LLM modellari o'rtasidagi farq",
                    "Asosiy SI texnologiyalari",
                    "NLP - nutq bilan ishlash nima?",
                    "Computer vision nima?",
                    "SI imkoniyatlari va cheklovlari",
                    "SI amaliy sohalarda qo'llanilishi",
                    "To'g'ri Prompt yozish",
                    "SI gallyutsinatsiyasi",
                    "Rasm generatsiyasi",
                    "SI bilan shaxsiy o'rgatuvchi repititor loyiha",
                    "Google AI Studio bilan ishlash",
                    "Bolt yordamida sayt qurish",
                    "Antigravity bilan ilova qurish",
                    "VS code dasturini o'rnatish",
                    "VS code sozlamalari",
                    "NodeJs nima va uni o'rnatish",
                    "HTML nima va u qanday ishlaydi va qayerda",
                    "Git va Github",
                    "Githubda repository ochish va loyihani yuborish",
                    "Vercel bilan ishlash",
                    "CSS nima va u qanday ishlaydi va qayerda",
                    "Tailwind nima va u qanday ishlaydi va qayerda",
                    "JS nima va u qanday ishlaydi va qayerda",
                    "JS kutubxonalari haqida tushunchalar",
                    "TS nima va u qanday ishlaydi va qayerda",
                    "Yakuniy imtihon"
                ]
            },
            {
                id: 2,
                stage: "2-BOSQICH · AMALIY LOYIHALAR",
                monthTitle: "2-oy · SI bilan loyihalar qurish",
                description: "Telegram bot, Landing page, Portfolio sayt yaratish, serverlar va ma'lumotlar bazasi (Supabase, Firebase) bilan ishlash.",
                points: [
                    "Telegramda ishlaydigan yordamchi yasash",
                    "Mahsulot sotadigan sayt qurish",
                    "O'zingiz haqingizdagi sayt qurish",
                    "Mijoz ma'lumotlarini saqlashni o'rganish"
                ],
                topics: [
                    "SI bilan Telegram bot qurish",
                    "SI bilan Landing page - Sotuv saytini qurish",
                    "SI bilan Portfolio sayt qurish",
                    "Serverlar bilan ishlash",
                    "Databaselar bilan ishlash (Supabase, Firebase)",
                    "SI'ni turli muhitlarda ishlatish",
                    "Yakuniy oy imtihoni"
                ]
            },
            {
                id: 3,
                stage: "3-BOSQICH · INTEGRATSIYA VA WEB LOYIHALAR",
                monthTitle: "3-oy · SI bilan chuqurlashtirilgan loyihalar",
                description: "Bulutli va jamoaviy vositalar, amoCRM integratsiyasi, korporativ saytlar, QR skaner, poyga o'yini va shaxsiy repititor loyihasi.",
                points: [
                    "Ish hujjatlarini onlayn boshqarish",
                    "Mijozlar bilan ishlash tizimini ulash",
                    "Kompaniya uchun sayt qurish",
                    "O'yin va QR o'qiydigan dastur yasash"
                ],
                topics: [
                    "SI skillari bilan ishlash",
                    "Bulutli va Team bo'lib ishlash uchun kerakli loyihalar bilan ishlash (Google Drive, Google Sheets, Jira, Notion, Obsidian, Trello, Calendar bilan ishlash)",
                    "AMOCRM integratsiyalar",
                    "SI bilan Korporativ saytlar qurish",
                    "SI bilan QR codelar skaner qilish dasturi",
                    "SI bilan Poyga o'yinini yasash",
                    "SI bilan shaxsiy repititor web loyiha qurish"
                ]
            },
            {
                id: 4,
                stage: "4-BOSQICH · MULTI-PLATFORMA VA KLONLAR",
                monthTitle: "4-oy · SI bilan turli formatdagi loyihalar qurish",
                description: "Onlayn do'kon, telefon va kompyuter uchun dasturlar hamda mashhur Instagram va Telegram klonlarini yaratish.",
                points: [
                    "Onlayn do'kon ochish",
                    "Telefon uchun ilova yasash",
                    "Kompyuter uchun dastur yasash",
                    "Instagram va Telegramga o'xshash ilova qurish"
                ],
                topics: [
                    "SI bilan online magazine qurish",
                    "SI bilan Telefon uchun dastur qurish",
                    "SI bilan Kompyuter uchun dastur qurish",
                    "SI bilan Instagram clone",
                    "SI bilan Telegram clone qilish"
                ]
            },
            {
                id: 5,
                stage: "5-BOSQICH · YAGONA EKOTIZIM",
                monthTitle: "5-oy · SI bilan Ekosistema qurish",
                description: "Katta hajmdagi yagona tizim: Admin panel, LMS, Moliya (Finance) va SuperAdmin modullaridan iborat Navi Clone loyihasi.",
                points: [
                    "O'quv markaz uchun tizim qurish",
                    "Xodimlar uchun boshqaruv paneli",
                    "Pul va to'lovlar hisobini yuritish",
                    "Hammasini bitta tizimga birlashtirish"
                ],
                topics: [
                    "SI bilan Navi Clone'ni qurish (Admin panel, LMS, Finance, SuperAdmin)"
                ]
            },
            {
                id: 6,
                stage: "6-BOSQICH · SI AGENTLAR VA PRODUCTION",
                monthTitle: "6-oy · SI bilan eng foydali loyihalar",
                description: "Mustaqil SI agentlar yasash, ularni Telegram bot va loyihalarga ulash, kiberxavfsizlik hamda dasturlarni real internetga chiqarish.",
                points: [
                    "O'zi mustaqil ishlaydigan yordamchi yasash",
                    "Yordamchini Telegramga ulash",
                    "Ishni xavfsiz saqlash qoidalari",
                    "Dasturni internetga chiqarish"
                ],
                topics: [
                    "SI agent yasash",
                    "Telegram botda SI Agent ishlatish",
                    "Loyihalarga SI agentni ulash",
                    "Muhim Kiberxavfsizlik tushunchalari",
                    "Web ilovalarni internetda real ishlaydigan qilish"
                ]
            }
        ];

        const cardsGrid = document.getElementById('cardsGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalStage = document.getElementById('modalStage');
        const modalTitle = document.getElementById('modalTitle');
        const modalTopicList = document.getElementById('modalTopicList');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Render Cards
        courseData.forEach(month => {
            const card = document.createElement('div');
            card.className = 'card';
            const countLabel = month.topics.length === 1 ? "1 ta yirik loyiha" : `${month.topics.length} dars va loyiha`;

            const pointsHtml = month.points
                ? `<ul class="card-points">${month.points.map(p => `<li>${p}</li>`).join('')}</ul>`
                : `<p class="card-desc">${month.description}</p>`;

            card.innerHTML = `
                <div>
                    <div class="card-stage">${month.stage}</div>
                    <h3 class="card-title">${month.monthTitle}</h3>
                    ${pointsHtml}
                </div>
                <div class="card-footer">
                    <span>${countLabel} · tayyor ✓</span>
                    <span class="arrow-hint">Ko'rish &rarr;</span>
                </div>
            `;

            card.addEventListener('click', () => openModal(month));
            cardsGrid.appendChild(card);
        });

        function openModal(month) {
            modalStage.textContent = month.stage;
            modalTitle.textContent = month.monthTitle;
            modalTopicList.innerHTML = '';

            month.topics.forEach((topic, index) => {
                const li = document.createElement('li');
                li.className = 'topic-item';
                li.innerHTML = `
                    <span class="topic-num">${index + 1}</span>
                    <span class="topic-text">${topic}</span>
                `;
                modalTopicList.appendChild(li);
            });

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
</body>

</html>
